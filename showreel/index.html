<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Motion Reel</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%;font-display:block}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:block}
html,body{margin:0;height:100%;background:#030712;overflow:hidden}
body{display:grid;place-items:center;cursor:pointer}
canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
#hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 12px "JetBrains Mono",monospace;letter-spacing:.2em;color:#6B7280;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="reel" width="1920" height="1080"></canvas>
<div id="hint">CLICK OR SPACE TO PLAY · ARROWS TO SCRUB</div>
<audio id="music" src="reel.m4a" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   CLAUDE — MOTION REEL 2026
   Every frame is a pure function of time t. No keyframes, no timeline:
   springs, easings and closed-form paths on a 128 BPM grid.
   8 bars x 1.875s = 15.000s exactly.
   ===================================================================== */
const W=1920,H=1080,FPS=60,DUR=15,BPM=128,BEAT=60/BPM,BAR=BEAT*4,CUT=BEAT/2;
// Brand palette sampled from consulting.thomasbailly.com, plus two stretch tones (sky, panel).
const C={paper:'#FFFFFF',tile:'#EFEFEF',ink:'#030712',panel:'#0D1526',blue:'#0073D1',sky:'#4FB0FF',gray:'#6B7280'};
const DISP='"Bricolage Grotesque"',SANS='"Inter Tight"',MONO='"JetBrains Mono"';
const TAU=Math.PI*2;
const RENDER=new URLSearchParams(location.search).has('render');

/* ---------------- math ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const bump=x=>x<=0||x>=1?0:Math.sin(Math.PI*x)**2;
const E={
  inCubic:x=>x*x*x, outCubic:x=>1-(1-x)**3,
  inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  inExpo:x=>x<=0?0:2**(10*x-10), outExpo:x=>x>=1?1:1-2**(-10*x),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  inOutQuint:x=>x<.5?16*x**5:1-(-2*x+2)**5/2,
  inBack:(x,s=1.70158)=>(s+1)*x*x*x-s*x*x,
};
// damped spring step response: 0 -> 1 with overshoot (f = Hz, z = damping ratio)
function spring(t,f=3,z=.45){
  if(t<=0) return 0;
  const w=TAU*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));
}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453123;return s-Math.floor(s)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RGB={};
const rgb=h=>RGB[h]||(RGB[h]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mix=(h1,h2,t,a=1)=>{const A=rgb(h1),B=rgb(h2);return `rgba(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')},${a})`};

/* ---------------- drawing helpers ---------------- */
function setFont(ctx,w,s,fam=DISP,it=false){ctx.font=`${it?'italic ':''}${w} ${s}px ${fam}`;}
function txt(ctx,str,x,y,o={}){
  const {w=500,s=14,fam=MONO,it=false,color=C.ink,align='left',ls=0,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); setFont(ctx,w,s,fam,it); ctx.letterSpacing=ls+'px'; ctx.textAlign=align; ctx.textBaseline='alphabetic';
  ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.fillText(str,x,y); ctx.restore();
}
const GLY='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>';
function scramble(str,p,seed=0,tick=0){
  let o=''; const n=str.length;
  for(let i=0;i<n;i++){
    const ch=str[i], a=i/n*.7;
    if(ch===' ') o+=' ';
    else if(p>=a+.3) o+=ch;
    else if(p>a) o+=GLY[Math.floor(hash(i*7.3+seed*13.1+tick*.917)*GLY.length)];
    else o+=' ';
  }
  return o;
}
function poly(ctx,pts,fill){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function bg(ctx,col){ctx.fillStyle=col;ctx.fillRect(-60,-60,W+120,H+120);}
const mkCanvas=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

// bouncing-ball kinematics with squash & stretch (reused by the opening and the end card)
function ballPath(lt,o){
  const {ts,y0,imp,hts,floor,R}=o, yf=floor-R;
  let yc,vy;
  if(lt<imp[0]){const d=imp[0]-ts,u=clamp((lt-ts)/d);yc=lerp(y0,yf,u*u);vy=2*(yf-y0)*u/d;}
  else{
    let k=0; while(k<imp.length-1&&lt>=imp[k+1]) k++;
    if(k<imp.length-1){const d=imp[k+1]-imp[k],v=(lt-imp[k])/d;yc=yf-hts[k]*4*v*(1-v);vy=-hts[k]*4*(1-2*v)/d;}
    else{yc=yf;vy=0;}
  }
  let near=0,sq=0;
  for(const T of imp){const d=lt-T;near=Math.max(near,Math.exp(-((d/.012)**2)));sq+=d<0?.4*Math.exp(-((d/.006)**2)):.4*Math.exp(-d*12)*Math.cos(d*40);}
  const st=1+Math.min(.42,Math.abs(vy)/7000)*(1-near);
  const sy=st*(1-sq),sx=(1+sq)/st;
  return {yc:Math.min(yc,floor-R*sy),sx,sy,vy};
}
function ballShape(ctx,x,b,R){ctx.save();ctx.translate(x,b.yc);ctx.scale(b.sx,b.sy);ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.restore();}

let GRID_D,GRID_L,VIG;
function buildCaches(){
  GRID_D=mkCanvas(); let g=GRID_D.getContext('2d'); g.fillStyle='rgba(255,255,255,.075)';
  for(let x=60;x<W;x+=60)for(let y=60;y<H;y+=60)g.fillRect(x-1,y-1,2,2);
  GRID_L=mkCanvas(); g=GRID_L.getContext('2d'); g.fillStyle='rgba(3,7,18,.10)';
  for(let x=60;x<W;x+=60)for(let y=60;y<H;y+=60)g.fillRect(x-1,y-1,2,2);
  VIG=mkCanvas(); g=VIG.getContext('2d');
  const rg=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*1.1);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,'rgba(0,0,0,.16)');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
}

/* =====================================================================
   01 — SQUASH & STRETCH
   ===================================================================== */
const S1={ts:0,y0:-140,imp:[BEAT,2*BEAT,3*BEAT],hts:[270,140],floor:700,R:34};
const s1x=lt=>lerp(540,960,clamp(lt/(3*BEAT)));
function sIgnite(ctx,lt,t){
  const FY=S1.floor,R=S1.R,T3=3*BEAT;
  bg(ctx,C.ink);
  ctx.globalAlpha=E.outCubic(prog(lt,0,.6)); ctx.drawImage(GRID_D,0,0); ctx.globalAlpha=1;
  const gl=ctx.createRadialGradient(960,FY,0,960,FY,760);
  gl.addColorStop(0,rgba(C.blue,.22*E.outCubic(prog(lt,.2,1)))); gl.addColorStop(1,rgba(C.blue,0));
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
  // floor + ruler
  const fw=E.outExpo(prog(lt,.08,.8))*1500;
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(960-fw/2,FY,fw,1.5);
  for(let k=-12;k<=12;k++){const x=960+k*60;if(Math.abs(x-960)>fw/2)continue;ctx.fillRect(x-.5,FY,1,k%4?6:14);}
  const capA=1-prog(lt,1.2,1.38);
  txt(ctx,scramble('A MOTION REEL IN 900 FRAMES',prog(lt,.12,.7),1,Math.floor(t*30)),960,800,{s:15,ls:6,color:'#fff',align:'center',alpha:.75*capA});
  // shockwaves + sparks on every impact
  const amps=[1,.7,1.35];
  S1.imp.forEach((Ti,k)=>{
    const p=prog(lt,Ti,Ti+.7); if(p<=0||p>=1) return;
    const bx=s1x(Ti), r=18+280*amps[k]*E.outExpo(p);
    ctx.strokeStyle=rgba(C.sky,(1-p)*.9); ctx.lineWidth=3*(1-p)+.6;
    ctx.beginPath(); ctx.ellipse(bx,FY,r,r*.2,0,0,TAU); ctx.stroke();
    const d=lt-Ti;
    if(d<.5){
      ctx.strokeStyle=`rgba(255,255,255,${1-d/.5})`; ctx.lineWidth=2; ctx.beginPath();
      for(let j=0;j<12;j++){
        const a=-Math.PI*(.12+.76*hash(k*31+j)), sp=380+620*hash(k*17+j*3);
        const vx=Math.cos(a)*sp, vy=Math.sin(a)*sp;
        const x=bx+vx*d, y=FY+vy*d+1300*d*d; if(y>FY) continue;
        const vyy=vy+2600*d; ctx.moveTo(x,y); ctx.lineTo(x-vx*.03,y-vyy*.03);
      }
      ctx.stroke();
    }
  });
  // onion skin (the animator's ghost frames)
  if(lt<T3){
    for(let k=5;k>=1;k--){
      const tt=lt-k*.05; if(tt<0) continue;
      ballShape(ctx,s1x(tt),ballPath(tt,S1),R);
      ctx.strokeStyle=`rgba(255,255,255,${.3*(1-k/6)})`; ctx.lineWidth=1.5; ctx.stroke();
    }
    const b=ballPath(lt,S1);
    ballShape(ctx,s1x(lt),b,R); ctx.fillStyle=C.blue; ctx.fill();
    ctx.save(); ctx.globalCompositeOperation='lighter'; ballShape(ctx,s1x(lt),b,R*.55);
    ctx.fillStyle='rgba(79,176,255,.25)'; ctx.fill(); ctx.restore();
  } else {
    // the ball squashes into a line, the line opens into a page
    const d=lt-T3, p=E.inOutExpo(prog(d,0,.27));
    const bw=lerp(2*R*1.4,2700,p), bh=lerp(2*R*.6,6,p);
    ctx.fillStyle=C.blue; ctx.beginPath(); ctx.roundRect(960-bw/2,FY-bh,bw,bh,bh/2); ctx.fill();
    const q=E.inExpo(prog(d,.22,BEAT));
    if(q>0){
      const top=FY-q*(FY+30), bot=FY+q*(H-FY+30);
      ctx.fillStyle=C.paper; ctx.fillRect(0,top,W,bot-top);
      ctx.fillStyle=C.blue; ctx.fillRect(0,top-6,W,6); ctx.fillRect(0,bot,W,6);
    }
  }
  // annotation
  const an=prog(lt,BEAT+.05,BEAT+.35), anOut=1-prog(lt,1.28,1.4);
  if(an>0&&anOut>0){
    const px=s1x(BEAT)+44, py=FY-50, lx=1250, ly=520, L1=E.outCubic(an);
    ctx.strokeStyle=`rgba(255,255,255,${.55*anOut})`; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(lerp(px,lx-24,L1),lerp(py,ly+14,L1)); ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${anOut})`; ctx.beginPath(); ctx.arc(px,py,3.5,0,TAU); ctx.fill();
    const tp=E.outCubic(prog(lt,BEAT+.2,BEAT+.5));
    ctx.save(); ctx.beginPath(); ctx.rect(lx-10,ly-70,560*tp+10,120); ctx.clip();
    txt(ctx,'squash & stretch',lx,ly,{fam:DISP,w:700,s:46,it:true,color:'#fff',alpha:anOut});
    txt(ctx,'FIG. 01 — GRAVITY · TIMING · SPACING',lx,ly+36,{s:12,ls:3,color:'#8B93A3',alpha:anOut});
    ctx.restore();
  }
}

/* =====================================================================
   02 — KINETIC TYPE   (homage to the site hero: "from good to unparalleled.")
   ===================================================================== */
function ticker(ctx,str,y,off,color,alpha){
  ctx.save(); setFont(ctx,500,14,MONO); ctx.letterSpacing='4px'; ctx.fillStyle=color; ctx.globalAlpha*=alpha;
  const w=ctx.measureText(str).width; for(let x=((off%w)+w)%w-w;x<W;x+=w) ctx.fillText(str,x,y);
  ctx.fillRect(0,y-26,W,1); ctx.fillRect(0,y+14,W,1); ctx.restore();
}
const S2DOT={ts:2*BEAT+.05,y0:-80,imp:[2*BEAT+CUT,3*BEAT],hts:[80],floor:0,R:20};
function sType(ctx,lt,t){
  bg(ctx,C.paper); ctx.drawImage(GRID_L,0,0);
  const X0=150,BA=455,SA=170,BB=800,SB=228;
  const gp=E.outExpo(prog(lt,0,.6));
  // type guides
  ctx.fillStyle=rgba(C.blue,.9); ctx.fillRect(0,BA,W*gp,1.5); ctx.fillRect(W*(1-gp),BB,W*gp,1.5);
  ctx.save(); ctx.strokeStyle=rgba(C.ink,.22); ctx.setLineDash([6,8]); ctx.lineWidth=1.2; ctx.beginPath();
  ctx.moveTo(W,BA-SA*.7); ctx.lineTo(W*(1-gp),BA-SA*.7); ctx.moveTo(0,BB-SB*.5); ctx.lineTo(W*gp,BB-SB*.5); ctx.stroke(); ctx.restore();
  txt(ctx,'BASELINE',W-60,BA-10,{s:11,ls:3,color:C.blue,align:'right',alpha:gp,w:600});
  txt(ctx,'CAP HEIGHT',W-60,BA-SA*.7-10,{s:11,ls:3,color:C.gray,align:'right',alpha:gp,w:600});
  txt(ctx,'X-HEIGHT',W-60,BB-SB*.5-10,{s:11,ls:3,color:C.gray,align:'right',alpha:gp,w:600});
  ticker(ctx,'KINETIC TYPE — BRICOLAGE GROTESQUE — WEIGHT 200 TO 800 — ',140,-lt*170,C.gray,.8);
  ticker(ctx,'FROM GOOD TO UNPARALLELED · SPRING 2.4HZ · DAMPING 0.62 · ',975,lt*170-300,C.gray,.8);
  const exitA=(i,st)=>E.inBack(prog(lt,1.4+i*st,1.4+i*st+.3),2);
  // line A — "from good to"
  const goodW=lerp(800,200,E.inOutCubic(prog(lt,BEAT+.05,BEAT+.45)));
  let x=X0, gx=0, gwid=0, gyo=0;
  ctx.save(); ctx.beginPath(); ctx.rect(0,BA-SA*1.02,W,SA*1.3); ctx.clip();
  ['from','good','to'].forEach((s,i)=>{
    setFont(ctx,i===1?goodW:800,SA); ctx.letterSpacing='-3px';
    const ww=ctx.measureText(s).width;
    const yo=(1-spring(lt-i*.06,2.2,.62))*SA*1.4-exitA(i,.03)*SA*1.7;
    ctx.fillStyle=i===1?mix(C.ink,C.gray,prog(lt,BEAT+.05,BEAT+.4)):C.ink; ctx.fillText(s,x,BA+yo);
    if(i===1){gx=x;gwid=ww;gyo=yo;}
    x+=ww+SA*.24;
  });
  ctx.restore();
  const strike=E.inOutExpo(prog(lt,BEAT-.06,BEAT+.16));
  if(strike>0){ ctx.fillStyle=C.blue; ctx.fillRect(gx-10,BA-SA*.3+gyo,(gwid+20)*strike,14); }
  const wa=prog(lt,BEAT,BEAT+.1)*(1-prog(lt,1.3,1.4));
  txt(ctx,`wght ${Math.round(goodW)}`,gx,BA-SA*.82,{s:13,w:600,color:C.blue,alpha:wa});
  // line B — "unparalleled" drops in, italic, with a travelling weight wave
  const word='unparalleled'; let xs=X0-6; const L=[];
  for(let i=0;i<word.length;i++){
    const wv=800-560*bump((lt-(2*BEAT+.05)-i*.035)/.4);
    setFont(ctx,wv,SB,DISP,true); ctx.letterSpacing='0px';
    const cw=ctx.measureText(word[i]).width; L.push([word[i],xs,wv]); xs+=cw-5;
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0,BB-SB*1.05,W,SB*1.35); ctx.clip();
  L.forEach(([ch,lx,wv],i)=>{
    const yo=-(1-spring(lt-(2*BEAT-.1)-i*.022,2.6,.5))*SB*1.3-exitA(i,.015)*SB*1.6;
    setFont(ctx,wv,SB,DISP,true); ctx.fillStyle=C.blue; ctx.fillText(ch,lx,BB+yo);
  });
  ctx.restore();
  // the full stop is a ball
  const dotX=xs+22, dot={...S2DOT,floor:BB}, db=ballPath(lt,dot), ds=1-E.inBack(prog(lt,1.45,1.7));
  if(ds>0){ ctx.save(); ctx.translate(dotX,BB); ctx.scale(ds,ds); ctx.translate(-dotX,-BB); ballShape(ctx,dotX,db,dot.R); ctx.fillStyle=C.ink; ctx.fill(); ctx.restore(); }
  dot.imp.forEach(Ti=>{const p=prog(lt,Ti,Ti+.45);if(p<=0||p>=1)return;const r=10+90*E.outExpo(p);
    ctx.strokeStyle=rgba(C.blue,1-p);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(dotX,BB,r,r*.22,0,0,TAU);ctx.stroke();});
  // exit wipe
  const pw=E.inOutExpo(prog(lt,1.42,1.875));
  if(pw>0){
    const xl=lerp(W+320,-320,pw);
    poly(ctx,[[xl+180,0],[W+60,0],[W+60,H],[xl-180,H]],C.blue);
    poly(ctx,[[xl+250,0],[W+60,0],[W+60,H],[xl-110,H]],C.ink);
  }
}

/* =====================================================================
   03 — SHAPE MORPH
   ===================================================================== */
const SN=240; let SHAPES,SYM;
function rayPoly(verts){
  const pts=[];
  for(let j=0;j<SN;j++){
    const a=-Math.PI/2+j/SN*TAU, dx=Math.cos(a), dy=Math.sin(a); let best=1e9;
    for(let k=0;k<verts.length;k++){
      const [x1,y1]=verts[k],[x2,y2]=verts[(k+1)%verts.length], ex=x2-x1, ey=y2-y1, den=ex*dy-dx*ey;
      if(Math.abs(den)<1e-12) continue;
      const tt=(ex*y1-x1*ey)/den, s=(dx*y1-dy*x1)/den;
      if(tt>0&&s>=-1e-6&&s<=1+1e-6&&tt<best) best=tt;
    }
    pts.push([dx*best,dy*best]);
  }
  return pts;
}
function buildShapes(){
  const circ=[],bloom=[];
  for(let j=0;j<SN;j++){const a=-Math.PI/2+j/SN*TAU;circ.push([Math.cos(a),Math.sin(a)]);const r=1+.16*Math.cos(6*(a+Math.PI/2));bloom.push([r*Math.cos(a),r*Math.sin(a)]);}
  const ngon=(n,R,a0)=>Array.from({length:n},(_,k)=>[R*Math.cos(a0+k*TAU/n),R*Math.sin(a0+k*TAU/n)]);
  const star=Array.from({length:10},(_,k)=>{const r=k%2?.62:1.45,a=-Math.PI/2+k*TAU/10;return[r*Math.cos(a),r*Math.sin(a)]});
  SHAPES=[circ,rayPoly(ngon(4,1.25,-Math.PI/4)),rayPoly(ngon(3,1.45,-Math.PI/2)),rayPoly(star),bloom];
  SYM=[0,TAU/4,TAU/3,TAU/5,TAU/6];
}
const MA=[BEAT,2*BEAT,3*BEAT,1.74];
function morphAt(lt){
  let k=0; while(k<4&&lt>=MA[k]+.04) k++;
  if(k===4) return {A:SHAPES[4],B:SHAPES[4],p:0,rot:0,k,u:1};
  const u=prog(lt,MA[k]-.26,MA[k]+.04), p=E.inOutQuint(u);
  return {A:SHAPES[k],B:SHAPES[k+1],p,rot:p*SYM[k+1],k,u};
}
function morphScale(lt){
  let s=260*spring(lt+.02,2.1,.42);
  for(let k=0;k<3;k++){const d=lt-MA[k]-.04;if(d>0)s*=1+.09*Math.exp(-d*9);}
  return s*(1+11*E.inExpo(prog(lt,1.5,1.875)));
}
function shapePath(ctx,lt,cx,cy,xs=1,keep=false){
  const m=morphAt(lt), s=morphScale(lt)*xs, r=m.rot+1.3*E.inExpo(prog(lt,1.45,1.875)), cr=Math.cos(r), sr=Math.sin(r);
  const pts=keep?[]:null; ctx.beginPath();
  for(let j=0;j<SN;j++){
    const x=lerp(m.A[j][0],m.B[j][0],m.p), y=lerp(m.A[j][1],m.B[j][1],m.p);
    const X=cx+s*(x*cr-y*sr), Y=cy+s*(x*sr+y*cr);
    j?ctx.lineTo(X,Y):ctx.moveTo(X,Y); if(keep) pts.push([X,Y]);
  }
  ctx.closePath(); return {m,pts,s};
}
function sMorph(ctx,lt,t){
  bg(ctx,C.ink); ctx.drawImage(GRID_D,0,0);
  const cx=960, cy=540, exA=1-prog(lt,1.55,1.8);
  for(let e=16;e>=1;e--){
    const tt=lt-e*.026; if(tt<0) continue;
    shapePath(ctx,tt,cx,cy,1+e*.05);
    ctx.strokeStyle=mix(C.sky,C.blue,e/16,.62*(1-e/17)*exA); ctx.lineWidth=2; ctx.stroke();
  }
  const {m,pts,s}=shapePath(ctx,lt,cx,cy,1,true);
  const fc=E.inOutCubic(prog(lt,1.5,1.76));
  const gr=ctx.createLinearGradient(cx-300,cy-300,cx+300,cy+300);
  gr.addColorStop(0,mix(C.sky,C.paper,fc)); gr.addColorStop(1,mix(C.blue,C.paper,fc));
  ctx.fillStyle=gr; ctx.fill();
  // selection UI: bounding box, vertex handles, bezier tangents
  const ha=E.outCubic(prog(lt,.15,.4))*(1-prog(lt,1.35,1.5));

  const r=mulberry(11);

  const tg=[]; for(let i=0;i<GN;i++){const p=pts[i%pts.length],j=i>=pts.length;tg.push([p[0]+(j?(r()-.5)*4:0),p[1]+(j?(r()-.5)*4:0)]);}

}

  const sp=prog(lt,.95,1.35);
  txt(ctx,scramble('MOTION DESIGNER · 15 SECONDS · 900 FRAMES · 128 BPM · 100% CODE',sp,8,Math.floor(t*30)),X0,965,{s:13,ls:4,color:C.gray,w:600});
  txt(ctx,scramble('STYLED AFTER CONSULTING.THOMASBAILLY.COM',prog(lt,.5,.9),9,Math.floor(t*30)),W-150,300,{s:12,ls:3,color:C.gray,w:600,align:'right'});
}

/* =====================================================================
   HUD + frame assembly
   ===================================================================== */
const SCN=[{n:'SQUASH & STRETCH',f:sIgnite},{n:'KINETIC TYPE',f:sType},{n:'SHAPE MORPH',f:sMorph},{n:'DATA IN MOTION',f:sData},{n:'3D + ARCS',f:sGlobe},{n:'PARTICLES',f:sParticles},{n:'THE EDIT',f:sMontage},{n:'RESOLVE',f:sEnd}];
function hud(ctx,t,tf,i){
  const a=E.outCubic(prog(t,.05,.5))*(1-E.inCubic(prog(t,14.55,14.95))); if(a<=0) return;
  const solid=(tf>=6*BAR+CUT&&tf<6*BAR+2*CUT)||(tf>=6*BAR+6*CUT&&tf<PORTAL_T1);
  ctx.save(); ctx.globalAlpha=a; if(!solid) ctx.globalCompositeOperation='difference';
  ctx.fillStyle='#fff'; ctx.strokeStyle='#fff';
  const m=44,L=24; ctx.lineWidth=2; ctx.beginPath();
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.moveTo(x+sx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*L);}); ctx.stroke();
  setFont(ctx,500,13,MONO); ctx.letterSpacing='3px';
  ctx.fillText('CLAUDE — MOTION REEL 2026',m+38,m+17);
  const f=Math.floor(tf*FPS+1e-6); ctx.textAlign='right';
  ctx.fillText(`TC 00:00:${String(Math.floor(f/FPS)).padStart(2,'0')}:${String(f%FPS).padStart(2,'0')}`,W-m-38,m+17);
  ctx.textAlign='left'; const lt=tf-i*BAR;
  ctx.fillText(`0${i+1} / 08   `+scramble(SCN[i].n,prog(lt,0,.4),i,Math.floor(t*30)),m+38,H-m-8);
  for(let k=0;k<8;k++){const x=W-m-38-(8-k)*30+6,y=H-m-14;ctx.globalAlpha=a*.3;ctx.fillRect(x,y,24,3);const fp=k<i?1:k===i?clamp(lt/BAR):0;if(fp>0){ctx.globalAlpha=a;ctx.fillRect(x,y,24*fp,3);}}
  const b=Math.floor(t/BEAT+1e-6)%4, bp=(t/BEAT)%1;
  for(let k=0;k<4;k++){ctx.globalAlpha=a*(k===b?1-.6*bp:.25);ctx.beginPath();ctx.arc(960+(k-1.5)*16,m+12,3.2,0,TAU);ctx.fill();}
  ctx.restore();
}
function draw(ctx,t,tf=t){
  const i=Math.min(7,Math.floor(tf/BAR+1e-9));
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.letterSpacing='0px'; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.setLineDash([]);
  if(tf>=PORTAL_T0&&tf<PORTAL_T1){sEnd(ctx,t-7*BAR,t,tf);portal(ctx,t);}
  else SCN[i].f(ctx,t-i*BAR,t,tf);
  ctx.restore();
  hud(ctx,t,tf,i);
}

/* ---------------- output ---------------- */
const out=document.getElementById('reel'), octx=out.getContext('2d');
const buf=mkCanvas(), bctx=buf.getContext('2d');
// light scenes keep the brand's clean white, dark scenes get the full vignette
function vignette(ctx,tf){
  const i=Math.min(7,Math.floor(tf/BAR+1e-9));
  const a=i===6?([.3,.6,1,.3,.3,1,.6][Math.floor((tf-6*BAR)/CUT+1e-6)]??.6):[1,.3,1,.3,1,1,1,.3][i];
  ctx.globalAlpha=a; ctx.drawImage(VIG,0,0); ctx.globalAlpha=1;
}
// sub > 1 renders a 180-degree shutter: sub-frames averaged into real motion blur
function renderFrame(f,sub=1){
  const tf=f/FPS, sh=.5/FPS;
  if(sub<=1) draw(octx,tf,tf);
  else{for(let k=0;k<sub;k++){draw(bctx,tf+k/sub*sh,tf);octx.globalAlpha=1/(k+1);octx.drawImage(buf,0,0);}octx.globalAlpha=1;}
  vignette(octx,tf);
}
window.reel={
  ready:(async()=>{
    await Promise.all([document.fonts.load(`800 100px ${DISP}`),document.fonts.load(`italic 800 100px ${DISP}`),document.fonts.load(`500 20px ${SANS}`),document.fonts.load(`500 20px ${MONO}`)]);
    await document.fonts.ready;
    buildCaches(); buildShapes(); buildChart(); buildGlobe(); buildParticles();
    return true;
  })(),
  renderFrame, snap:()=>out.toDataURL('image/png'), FPS, DUR,
};
if(!RENDER){
  window.reel.ready.then(()=>{
    const music=document.getElementById('music'), hint=document.getElementById('hint');
    let playing=false, base=0, start=0;
    const cur=()=>playing?Math.min(DUR,base+(performance.now()-start)/1000):base;
    function play(){if(base>=DUR-.01)base=0;start=performance.now();playing=true;hint.style.opacity=0;try{music.currentTime=base;music.play().catch(()=>{});}catch(e){}}
    function pause(){base=cur();playing=false;music.pause();hint.style.opacity=1;}
    function frame(){
      let t=cur();
      if(playing&&t>=DUR){playing=false;base=DUR-.001;music.pause();hint.style.opacity=1;t=base;}
      draw(octx,t,t); vignette(octx,t); requestAnimationFrame(frame);
    }
    addEventListener('click',()=>playing?pause():play());
    addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault();playing?pause():play();}
      if(e.code==='ArrowRight'||e.code==='ArrowLeft'){base=clamp(cur()+(e.code==='ArrowRight'?.5:-.5),0,DUR-.001);if(playing){start=performance.now();music.currentTime=base;}}
    });
    requestAnimationFrame(frame);
  });
}
</script>

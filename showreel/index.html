<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thom Bailly Reel</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%;font-display:block}
@font-face{font-family:"Inter Tight";src:url(fonts/inter-tight-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:block}
html,body{margin:0;height:100%;background:#030712;overflow:hidden}
body{display:grid;place-items:center;cursor:pointer}
canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
#hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 12px "JetBrains Mono",monospace;letter-spacing:.2em;color:#6B7280;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="reel" width="1920" height="1080"></canvas>
<div id="hint">CLICK OR SPACE TO PLAY · ARROWS TO SCRUB</div>
<audio id="music" src="reel.m4a" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   THOM BAILLY — 15-SECOND REEL
   Every frame is a pure function of time t: springs, easings and
   closed-form paths, locked to the beat grid of "Boardroom Drift"
   (130.2 BPM; the cut starts 42.434s into the track, one bar before a drop).
     00.000  the ball        — squash & stretch, the line opens the page on the drop
     01.843  $300M           — revenue, restructured
     05.530  5 continents    — routes out of London, the count climbs to 5
     10.139  the hero card   — the site's own line; the ball lands as the full stop
   ===================================================================== */
const W=1920,H=1080,FPS=60,DUR=15,BEAT=.4608572,EIGHTH=BEAT/2;   // beat period measured from the track
const T_REV=4*BEAT, T_GLOBE=12*BEAT, T_END=22*BEAT;
// Brand palette sampled from consulting.thomasbailly.com, plus one stretch tone (sky).
const C={paper:'#FFFFFF',ink:'#030712',blue:'#0073D1',sky:'#4FB0FF',gray:'#6B7280'};
const DISP='"Bricolage Grotesque"',SANS='"Inter Tight"',MONO='"JetBrains Mono"';
const TAU=Math.PI*2;
const RENDER=new URLSearchParams(location.search).has('render');

/* ---------------- math ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const bump=x=>x<=0||x>=1?0:Math.sin(Math.PI*x)**2;
const E={
  inCubic:x=>x*x*x, outCubic:x=>1-(1-x)**3,
  inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  inExpo:x=>x<=0?0:2**(10*x-10), outExpo:x=>x>=1?1:1-2**(-10*x),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
};
// damped spring step response: 0 -> 1 with overshoot (f = Hz, z = damping ratio)
function spring(t,f=2,z=.5){
  if(t<=0) return 0;
  const w=TAU*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));
}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453123;return s-Math.floor(s)};
const RGB={};
const rgb=h=>RGB[h]||(RGB[h]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mix=(h1,h2,t,a=1)=>{const A=rgb(h1),B=rgb(h2);return `rgba(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')},${a})`};

/* ---------------- drawing helpers ---------------- */
function setFont(ctx,w,s,fam=DISP,it=false){ctx.font=`${it?'italic ':''}${w} ${s}px ${fam}`;}
function txt(ctx,str,x,y,o={}){
  const {w=500,s=14,fam=MONO,it=false,color=C.ink,align='left',ls=0,alpha=1}=o;
  if(alpha<=0) return;
  ctx.save(); setFont(ctx,w,s,fam,it); ctx.letterSpacing=ls+'px'; ctx.textAlign=align; ctx.textBaseline='alphabetic';
  ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.fillText(str,x,y); ctx.restore();
}
const GLY='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function scramble(str,p,seed=0,tick=0){
  let o=''; const n=str.length;
  for(let i=0;i<n;i++){
    const ch=str[i], a=i/n*.7;
    if(ch===' '||ch==='.') o+=p>a?ch:' ';
    else if(p>=a+.3) o+=ch;
    else if(p>a) o+=GLY[Math.floor(hash(i*7.3+seed*13.1+tick*.917)*GLY.length)];
    else o+=' ';
  }
  return o;
}
function bg(ctx,col){ctx.fillStyle=col;ctx.fillRect(-60,-60,W+120,H+120);}
const mkCanvas=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

// bouncing-ball kinematics with squash & stretch (the opening ball and the closing full stop)
function ballPath(lt,o){
  const {ts,y0,imp,hts,floor,R}=o, yf=floor-R;
  let yc,vy;
  if(lt<imp[0]){const d=imp[0]-ts,u=clamp((lt-ts)/d);yc=lerp(y0,yf,u*u);vy=2*(yf-y0)*u/d;}
  else{
    let k=0; while(k<imp.length-1&&lt>=imp[k+1]) k++;
    if(k<imp.length-1){const d=imp[k+1]-imp[k],v=(lt-imp[k])/d;yc=yf-hts[k]*4*v*(1-v);vy=-hts[k]*4*(1-2*v)/d;}
    else{yc=yf;vy=0;}
  }
  let near=0,sq=0;
  for(const T of imp){const d=lt-T;near=Math.max(near,Math.exp(-((d/.012)**2)));sq+=d<0?.4*Math.exp(-((d/.006)**2)):.4*Math.exp(-d*11)*Math.cos(d*36);}
  const st=1+Math.min(.42,Math.abs(vy)/7000)*(1-near);
  const sy=st*(1-sq),sx=(1+sq)/st;
  return {yc:Math.min(yc,floor-R*sy),sx,sy,vy};
}
function ballShape(ctx,x,b,R){ctx.save();ctx.translate(x,b.yc);ctx.scale(b.sx,b.sy);ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.restore();}
function impactRing(ctx,x,y,lt,T,size,col,dur=.6){
  const p=prog(lt,T,T+dur); if(p<=0||p>=1) return;
  const r=10+size*E.outExpo(p);
  ctx.strokeStyle=rgba(col,1-p); ctx.lineWidth=2.5*(1-p)+.6; ctx.beginPath(); ctx.ellipse(x,y,r,r*.2,0,0,TAU); ctx.stroke();
}

let GRID_D,GRID_L,VIG;
function buildCaches(){
  GRID_D=mkCanvas(); let g=GRID_D.getContext('2d'); g.fillStyle='rgba(255,255,255,.07)';
  for(let x=60;x<W;x+=60)for(let y=60;y<H;y+=60)g.fillRect(x-1,y-1,2,2);
  GRID_L=mkCanvas(); g=GRID_L.getContext('2d'); g.fillStyle='rgba(3,7,18,.08)';
  for(let x=60;x<W;x+=60)for(let y=60;y<H;y+=60)g.fillRect(x-1,y-1,2,2);
  VIG=mkCanvas(); g=VIG.getContext('2d');
  const rg=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*1.1);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,'rgba(0,0,0,.16)');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
}

/* =====================================================================
   00.000 — THE BALL   (bounces on the break's beats, stretches on its build)
   ===================================================================== */
const S1={ts:.05,y0:-140,imp:[BEAT,2*BEAT,3*BEAT],hts:[260,140],floor:700,R:36};
const s1x=lt=>lerp(560,960,prog(lt,S1.ts,3*BEAT));
function sIntro(ctx,lt){
  const FY=S1.floor,R=S1.R,T3=3*BEAT;
  bg(ctx,C.ink);
  ctx.globalAlpha=E.outCubic(prog(lt,0,.8)); ctx.drawImage(GRID_D,0,0); ctx.globalAlpha=1;
  const gl=ctx.createRadialGradient(960,FY,0,960,FY,780);
  gl.addColorStop(0,rgba(C.blue,.22*E.outCubic(prog(lt,.2,1.2)))); gl.addColorStop(1,rgba(C.blue,0));
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
  const fw=E.outExpo(prog(lt,.1,1))*1500;
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(960-fw/2,FY,fw,1.5);
  // impact rings + sparks
  S1.imp.forEach((Ti,k)=>{
    const bx=s1x(Ti); impactRing(ctx,bx,FY,lt,Ti,[280,200,380][k],C.sky,.8);
    const d=lt-Ti;
    if(d>0&&d<.55){
      ctx.strokeStyle=`rgba(255,255,255,${1-d/.55})`; ctx.lineWidth=2; ctx.beginPath();
      for(let j=0;j<12;j++){
        const a=-Math.PI*(.12+.76*hash(k*31+j)), sp=340+560*hash(k*17+j*3);
        const vx=Math.cos(a)*sp, vy=Math.sin(a)*sp, x=bx+vx*d, y=FY+vy*d+1100*d*d; if(y>FY) continue;
        ctx.moveTo(x,y); ctx.lineTo(x-vx*.03,y-(vy+2200*d)*.03);
      }
      ctx.stroke();
    }
  });
  if(lt<T3){
    for(let k=5;k>=1;k--){
      const tt=lt-k*.06; if(tt<S1.ts) continue;
      ballShape(ctx,s1x(tt),ballPath(tt,S1),R);
      ctx.strokeStyle=`rgba(255,255,255,${.28*(1-k/6)})`; ctx.lineWidth=1.5; ctx.stroke();
    }
    const b=ballPath(lt,S1);
    ballShape(ctx,s1x(lt),b,R); ctx.fillStyle=C.blue; ctx.fill();
  } else {
    // the ball squashes into a line, the line opens into a page
    const d=lt-T3, p=E.inOutExpo(prog(d,0,.28));
    const bw=lerp(2*R*1.4,2700,p), bh=lerp(2*R*.6,6,p);
    ctx.fillStyle=C.blue; ctx.beginPath(); ctx.roundRect(960-bw/2,FY-bh,bw,bh,bh/2); ctx.fill();
    const q=E.inExpo(prog(d,.22,BEAT));
    if(q>0){
      const top=FY-q*(FY+30), bot=FY+q*(H-FY+30);
      ctx.fillStyle=C.paper; ctx.fillRect(0,top,W,bot-top);
      ctx.fillStyle=C.blue; ctx.fillRect(0,top-6,W,6); ctx.fillRect(0,bot,W,6);
    }
  }
}

/* =====================================================================
   01.843 — $300M, REVENUE RESTRUCTURED
   ===================================================================== */
const BARS=14, BV=Array.from({length:BARS},(_,k)=>Math.max(.03,(Math.exp(k*.34)-1)/(Math.exp(13*.34)-1)));
const CH={X0:900,X1:1760,Y0:820,Y1:250};
let LINE=[];
function catmull(P,seg=14){
  const o=[];
  for(let i=0;i<P.length-1;i++){
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t;o.push([0,1].map(d=>.5*(2*p1[d]+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)));}
  }
  o.push(P[P.length-1]); return o;
}
function buildChart(){const sp=(CH.X1-CH.X0)/BARS;LINE=catmull(BV.map((v,k)=>[CH.X0+sp*(k+.5),CH.Y0-v*(CH.Y0-CH.Y1)-24]));}
// odometer column position: lower columns roll continuously, higher ones only on carry
function colPos(v,k){const p=10**k,q=Math.floor(v/p),r=v-q*p;if(k===0)return v;return q+(r>p-1?r-(p-1):0);}
const REV_LAND=4*BEAT, REV_LEN=T_GLOBE-T_REV;   // the counter lands on the next downbeat
function sRevenue(ctx,lt){
  bg(ctx,C.paper);
  const P=LINE[LINE.length-1];
  const zp=E.inExpo(prog(lt,REV_LEN-.75,REV_LEN)), mv=E.inOutCubic(prog(lt,REV_LEN-.9,REV_LEN-.15)), sc=1+zp*6;
  const Px=lerp(P[0],960,mv), Py=lerp(P[1],540,mv);
  ctx.save(); ctx.translate(Px,Py); ctx.scale(sc,sc); ctx.translate(-P[0],-P[1]);
  ctx.drawImage(GRID_L,0,0);
  const {X0,X1,Y0,Y1}=CH, sp=(X1-X0)/BARS;
  // axes + gridlines
  const ap=E.outExpo(prog(lt,0,.6));
  ctx.fillStyle=C.ink; ctx.fillRect(X0,Y0,(X1-X0)*ap,2); ctx.fillRect(X0,Y0-(Y0-Y1)*ap,2,(Y0-Y1)*ap);
  for(let k=1;k<=4;k++){
    const gy=Y0-k*(Y0-Y1)/4, g=E.outCubic(prog(lt,.15+k*.07,.6+k*.07));
    ctx.save(); ctx.setLineDash([4,6]); ctx.strokeStyle=rgba(C.ink,.13*g); ctx.beginPath(); ctx.moveTo(X0,gy); ctx.lineTo(X0+(X1-X0)*g,gy); ctx.stroke(); ctx.restore();
    txt(ctx,`$${k*75}M`,X0-16,gy+4,{s:12,color:C.gray,align:'right',alpha:g});
  }
  txt(ctx,'$0',X0-16,Y0+4,{s:12,color:C.gray,align:'right',alpha:ap});
  // bars on springs
  for(let k=0;k<BARS;k++){
    const g=spring(lt-(.3+k*.06),2,.5), h=BV[k]*(Y0-Y1)*g, bw=sp*.56, x=X0+sp*(k+.5)-bw/2;
    ctx.fillStyle=k>=BARS-3?C.blue:rgba(C.ink,.88); ctx.beginPath(); ctx.roundRect(x,Y0-h,bw,Math.max(0,h),[6,6,0,0]); ctx.fill();
  }
  // curve draws itself, area fills under it
  const pl=E.inOutCubic(prog(lt,.8,REV_LAND)), M=LINE.length-1, idx=pl*M, i0=Math.floor(idx);
  if(pl>0){
    const hd=i0>=M?LINE[M]:[lerp(LINE[i0][0],LINE[i0+1][0],idx-i0),lerp(LINE[i0][1],LINE[i0+1][1],idx-i0)];
    ctx.beginPath(); ctx.moveTo(LINE[0][0],Y0); for(let i=0;i<=i0;i++) ctx.lineTo(LINE[i][0],LINE[i][1]); ctx.lineTo(hd[0],hd[1]); ctx.lineTo(hd[0],Y0); ctx.closePath();
    const ag=ctx.createLinearGradient(0,Y1,0,Y0); ag.addColorStop(0,rgba(C.blue,.28)); ag.addColorStop(1,rgba(C.blue,0)); ctx.fillStyle=ag; ctx.fill();
    ctx.beginPath(); for(let i=0;i<=i0;i++) i?ctx.lineTo(LINE[i][0],LINE[i][1]):ctx.moveTo(LINE[i][0],LINE[i][1]); ctx.lineTo(hd[0],hd[1]);
    ctx.strokeStyle=C.blue; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
    const ring=(lt/BEAT)%1;
    ctx.strokeStyle=rgba(C.blue,.5*(1-ring)); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hd[0],hd[1],12+26*ring,0,TAU); ctx.stroke();
    ctx.fillStyle=mix(C.blue,C.ink,prog(lt,REV_LEN-.7,REV_LEN-.55)); ctx.beginPath(); ctx.arc(hd[0],hd[1],11,0,TAU); ctx.fill();
  }
  // odometer: $000M -> $300M, with a punch on landing
  const la=1-prog(lt,REV_LEN-.9,REV_LEN-.7), v=300*E.inOutCubic(prog(lt,.35,REV_LAND)), SZ=240, BASE=500;
  const punch=lt>REV_LAND?1+.06*Math.exp(-(lt-REV_LAND)*7)*Math.cos((lt-REV_LAND)*18):1;
  ctx.save(); ctx.globalAlpha*=la; ctx.translate(130,BASE); ctx.scale(punch,punch); ctx.translate(-130,-BASE);
  setFont(ctx,800,SZ*.78,DISP,true); const dw=ctx.measureText('$').width;
  ctx.fillStyle=C.blue; ctx.fillText('$',126,BASE);
  setFont(ctx,800,SZ,DISP); const cw=ctx.measureText('0').width;
  for(let k=2;k>=0;k--){
    const pos=colPos(v,k), d=Math.floor(pos), f=pos-d, cx=130+dw+8+(2-k)*cw;
    ctx.save(); ctx.beginPath(); ctx.rect(cx,BASE-SZ*.8,cw,SZ*.86); ctx.clip();
    setFont(ctx,800,SZ,DISP); ctx.textAlign='center'; ctx.fillStyle=(v<10**k&&k>0)?rgba(C.ink,.12):C.ink;
    ctx.fillText(String(d%10),cx+cw/2,BASE-f*SZ*.9); ctx.fillText(String((d+1)%10),cx+cw/2,BASE+(1-f)*SZ*.9);
    ctx.restore();
  }
  setFont(ctx,800,SZ,DISP); ctx.fillStyle=C.ink; ctx.fillText('M',130+dw+8+3*cw+6,BASE);
  ctx.restore();
  // the message
  [['Revenue,',665,0],['restructured.',777,.1]].forEach(([s,y,d])=>{
    ctx.save(); ctx.globalAlpha*=la; ctx.beginPath(); ctx.rect(0,y-102,880,134); ctx.clip();
    txt(ctx,s,130,y+(1-spring(lt-2*BEAT-d,1.8,.62))*140,{fam:DISP,w:800,s:96,it:true,color:C.blue,ls:-1});
    ctx.restore();
  });
  ctx.restore();
  // push into the data point: it becomes the planet
  if(lt>REV_LEN-.7){
    const r=11*sc+E.inExpo(prog(lt,REV_LEN-.65,REV_LEN))*1400;
    ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(Px,Py,r,0,TAU); ctx.fill();
    ctx.strokeStyle=C.blue; ctx.lineWidth=6; ctx.stroke();
  }
}

/* =====================================================================
   05.530 — 5 CONTINENTS
   ===================================================================== */
const GN=5200; const GP=[];
// 2-degree world land mask (90x180 bits, lat 90..-90, lon -180..180), derived from global-land-mask
const LAND_B64='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHwAfvAAAAAAAAAAAAAAAAAAAAAAAAx37///+AAAAAGoABAAAAAAAAAAAAAIe8P///wAA8AAAAAA0AAAAAAAAAAAwADw////4AAIAAAAAAHAAAAAAAAAAALivwAf//wAAAAADAAP/wAHIAAAAAADsj38AH/+gAAAAAEAH///OAAAAgBgAAfw3/gB/+gAAAgAMHe///+/9gBAP/7/nbdrwD/+AAAH/Ag7H////////8H//////g8H/gAAAf/6//f////////Mf/////9H4D4A+AA+ev///////////AP/////4A0B4AAAD5/////////////Af1////gHgA4AAAP5///////////LwAHgD///gH0AAAAAG4/////////+AMAABAC///4D+AAAAGCx/////////4A4AAAAB////n/gAAAOCR/////////4A4AAAAAf///3/wAAAbH//////////9AgAAAAAP/////gAAADf//////////9AAAAAAAF////0YAAAB///////////8AAAAAAAD////8EAAAB///v///////5AAAAAAAD////+AAAAB/f5f///////wAAAAAAAD////gAAAAfxnwP///////jgAAAAAAD///+AAAAAPCb3///////+AAAAAAAAD///8AAAAAfCJf//////+ECAAAAAAAB///8AAAAAGDRf///////mMAAAAAAAA///8AAAAAH+Ai///////E8AAAAAAAAf//wAAAAAP/AA///////BgAAAAAAAAP//gAAAAAf/73///////gAAAAAAAAAD/AQAAAAAf//9/f/////gAAAAAAAAAF+AQAAAAB///+/n/////AAAAAAAAAAC+AAAAAAB///+fwH///+AAAAAAAAAAAeAwAAAAD////f/D///8gAAAAAAAAAAeGEAAAAD////v+B/j/AAAAAAAAAAAAPMAwAAAD////n+AfB+gAAAAAAAAAAAD8AAAAAD////34AeBfAgAAAAAAAAAAAPAAAAAH////3gAcAfAgAAAAAAAAAAADAAAAAD////6AAcAfgwAAAAAAAAAAABBwAAAD////8wAMATAIAAAAAAAAAAAAr/AAAB/////gAIASAAAAAAAAAAAAAAH/gAAA/////gACAAAIAAAAAAAAAAAAH/8AAAYH///AAAAsGAAAAAAAAAAAAAH/+AAAAB//+AAAAUOAAAAAAAAAAAAAP/+AAAAB//8AAAAc+gAAAAAAAAAAAAP//gAAAD//4AAAAMeBgAAAAAAAAAAAP//8AAAB//wAAAAGdCuAAAAAAAAAAAf///AAAA//wAAAACAAHgAAAAAAAAAAP///gAAA//wAAAAB4AHggAAAAAAAAAH///AAAAf/wAAAAACIDQIAAAAAAAAAH//+AAAAf/wAAAAAAAAAAAAAAAAAAAD//+AAAA//wgAAAAABxAAAAAAAAAAAD//8AAAA//wgAAAAAHxgBAAAAAAAAAA//8AAAA//zgAAAAAf/gAAAAAAAAAAAf/8AAAA//DgAAAAAf/gAAAAAAAAAAAf/8AAAAf/DAAAAAD//4CAAAAAAAAAAf/wAAAAf/DAAAAAH//4AAAAAAAAAAAf/AAAAAf+DAAAAAH//8AAAAAAAAAAAf/AAAAAP8AAAAAAH//+AAAAAAAAAAA/+AAAAAP8AAAAAAH//+AAAAAAAAAAA/8AAAAAH4AAAAAAD//+AAAAAAAAAAA/8AAAAAHwAAAAAADwf8AAAAAAAAAAA/gAAAAAAAAAAAAACAP4AAAAAAAAAAB/wAAAAAAAAAAAAAAAD4AEAAAAAAAAB+AAAAAAAAAAAAAAAAAAAGAAAAAAAAB6AAAAAAAAAAAAAAAAAwAMAAAAAAAAA8AAAAAAAAAAAAAAAAAQAYAAAAAAAAB4AAAAAAAAAAAAAAAAAAAwAAAAAAAAB4AAAAAAAAAAAAAAAAAAAAAAAAAAAABwAAAAAAAAAACAAAAAAAAAAAAAAAAADgAAAAAAAAAAAAAAAAAAAAAAAAAAAABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAAAAAAA8AAf/8d/AAAAAAAAAAAAkAAAAAAACP/+H//////AAAAAAAAAAA+AAAAIf////+////////AAAAAAAOMKPAAAB///////////////gAAAH/8D//8AAAH//////////////4AAAF/////8AAAP///////////////4AAIf/////gwBwf///////////////4AAAH//////AAD////////////////wAAA///////+f//////////////////A/wH///////////////////////////////////////////////////////////////////////////////////////';
const LANDBITS=(()=>{const s=atob(LAND_B64),a=new Uint8Array(90*180);for(let i=0;i<a.length;i++)a[i]=(s.charCodeAt(i>>3)>>(7-(i&7)))&1;return a;})();
function isLand(lat,lon){return LANDBITS[clamp(Math.floor((90-lat)/2),0,89)*180+clamp(Math.floor((lon+180)/2),0,179)]===1;}
function buildGlobe(){
  const ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<GN;i++){const y=1-2*(i+.5)/GN,r=Math.sqrt(1-y*y),th=ga*i,x=Math.cos(th)*r,z=Math.sin(th)*r;
    GP.push({v:[x,y,z],land:isLand(Math.asin(y)*180/Math.PI,Math.atan2(x,z)*180/Math.PI),h:hash(i*3.7),s:hash(i*5.1)<.5?1:-1});}
}
const PITCH=.42,cP=Math.cos(PITCH),sP=Math.sin(PITCH);
const globeYaw=lt=>.35-.12*lt-1.4*(1-E.outExpo(prog(lt,0,1)));
const globeGeo=lt=>{const p=E.outExpo(prog(lt,0,.8));return{R:lerp(1350,400,p),cx:lerp(960,1300,p),cy:540};};
function gproj(v,yaw,g){const cy=Math.cos(yaw),sy=Math.sin(yaw),x=v[0]*cy+v[2]*sy,z1=v[2]*cy-v[0]*sy,y=v[1]*cP-z1*sP,z=v[1]*sP+z1*cP;return[g.cx+g.R*x,g.cy-g.R*y,z,x,y];}
const ll2v=(lat,lon)=>{const a=lat*Math.PI/180,b=lon*Math.PI/180;return[Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)];};
function dotStyle(p,z){return z>0?{a:p.land?.5+.5*z:.07+.16*z,s:(p.land?2.5:1.5)*(.6+.4*z)}:{a:p.land?.09:.04,s:1.2};}
function slerp(a,b,s){const d=Math.acos(clamp(a[0]*b[0]+a[1]*b[1]+a[2]*b[2],-1,1));if(d<1e-6)return a;const sa=Math.sin((1-s)*d)/Math.sin(d),sb=Math.sin(s*d)/Math.sin(d);return[a[0]*sa+b[0]*sb,a[1]*sa+b[1]*sb,a[2]*sa+b[2]*sb];}
const LDN=[51.5,-.13];
// one route per new continent; each landing adds one to the count (London = Europe = 1)
const ROUTES=[
  {ll:[40.7,-74],name:'NEW YORK',arr:2*BEAT},
  {ll:[-23.5,-46.6],name:'SÃO PAULO',arr:3*BEAT},
  {ll:[-26.2,28],name:'JOHANNESBURG',arr:4*BEAT},
  {ll:[25.2,55.3],name:'DUBAI',arr:5*BEAT},
];
const FLIGHT=.6, CONV=8*BEAT, CENTER=[960,540];
function arcPoint(A,B,dAng,s){const v=slerp(A,B,s),h=1+(.05+.32*dAng/Math.PI)*Math.sin(Math.PI*s);return[v[0]*h,v[1]*h,v[2]*h];}
function sGlobe(ctx,lt){
  bg(ctx,C.ink); ctx.globalAlpha=.6; ctx.drawImage(GRID_D,0,0); ctx.globalAlpha=1;
  const g=globeGeo(lt), yaw=globeYaw(lt), rs=g.R/400, gA=1-prog(lt,CONV,CONV+.35);
  if(gA>0){
    const ag=ctx.createRadialGradient(g.cx,g.cy,g.R*.85,g.cx,g.cy,g.R*1.45);
    ag.addColorStop(0,rgba(C.blue,.32*gA)); ag.addColorStop(1,rgba(C.blue,0));
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(g.cx,g.cy,g.R*1.45,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(8,22,44,${.7*gA})`; ctx.beginPath(); ctx.arc(g.cx,g.cy,g.R,0,TAU); ctx.fill();
    ctx.strokeStyle=rgba(C.sky,.28*gA); ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(g.cx,g.cy,g.R,0,TAU); ctx.stroke();
  }
  const ringA=1-prog(lt,0,.45);
  if(ringA>0){ctx.strokeStyle=rgba(C.blue,ringA);ctx.lineWidth=6;ctx.beginPath();ctx.arc(g.cx,g.cy,g.R+4,0,TAU);ctx.stroke();}
  // dots: back hemisphere first; in the exit every dot spirals into one point
  ctx.fillStyle='#fff';
  const front=[];
  for(const p of GP){
    const q=gproj(p.v,yaw,g), d=dotStyle(p,q[2]), u=prog(lt,CONV+p.h*.16,CONV+p.h*.16+.42);
    if(u>=1) continue;
    let x=q[0],y=q[1],a=d.a;
    if(u>0){
      const e=E.inCubic(u), ang=e*2.4*p.s, dx=x-CENTER[0], dy=y-CENTER[1], ca=Math.cos(ang), sa=Math.sin(ang);
      x=CENTER[0]+(dx*ca-dy*sa)*(1-e); y=CENTER[1]+(dx*sa+dy*ca)*(1-e); a=lerp(a,1,e);
    }
    if(q[2]>0&&u<=0){front.push([x,y,a,d.s*rs]);continue;}
    ctx.globalAlpha=a; const s=d.s*rs; ctx.fillRect(x-s/2,y-s/2,s,s);
  }
  for(const [x,y,a,s] of front){ctx.globalAlpha=a;ctx.fillRect(x-s/2,y-s/2,s,s);}
  ctx.globalAlpha=1;
  // routes out of London
  const exA=1-prog(lt,CONV-.1,CONV+.2), A=ll2v(...LDN);
  let count=1;
  ROUTES.forEach((r,k)=>{
    count+=E.inOutCubic(prog(lt,r.arr-.12,r.arr+.12));
    if(exA<=0) return;
    const hp=E.inOutCubic(prog(lt,r.arr-FLIGHT,r.arr)); if(hp<=0) return;
    const B=ll2v(...r.ll), dAng=Math.acos(clamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2],-1,1)), N=32;
    let prev=null;
    for(let i=0;i<=N;i++){
      const q=gproj(arcPoint(A,B,dAng,hp*i/N),yaw,g), vis=q[2]>0||q[3]*q[3]+q[4]*q[4]>1;
      if(prev){ctx.strokeStyle=mix(C.blue,C.sky,i/N,(vis?1:.15)*(.35+.65*i/N)*exA);ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
      prev=q;
    }
    if(hp<1){
      const gl=ctx.createRadialGradient(prev[0],prev[1],0,prev[0],prev[1],18); gl.addColorStop(0,rgba(C.sky,.8*exA)); gl.addColorStop(1,rgba(C.sky,0));
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(prev[0],prev[1],18,0,TAU); ctx.fill();
      ctx.fillStyle=`rgba(255,255,255,${exA})`; ctx.beginPath(); ctx.arc(prev[0],prev[1],4,0,TAU); ctx.fill();
    } else {
      // landed: ping, city label, and a pulse that keeps travelling the route
      const q=gproj(B,yaw,g), pp=prog(lt,r.arr,r.arr+.6);
      if(pp<1){ctx.strokeStyle=rgba(C.sky,(1-pp)*exA);ctx.lineWidth=2;ctx.beginPath();ctx.arc(q[0],q[1],5+34*E.outCubic(pp),0,TAU);ctx.stroke();}
      ctx.fillStyle=rgba(C.sky,exA); ctx.beginPath(); ctx.arc(q[0],q[1],4.5,0,TAU); ctx.fill();
      txt(ctx,r.name,q[0]+12,q[1]-10,{s:13,ls:2,color:'#fff',w:600,alpha:.9*exA*prog(lt,r.arr,r.arr+.2)*clamp(q[2]*4)});
      const s=((lt-r.arr)*.9+k*.25)%1, pq=gproj(arcPoint(A,B,dAng,s),yaw,g);
      ctx.fillStyle=`rgba(255,255,255,${.8*exA*Math.sin(Math.PI*s)})`; ctx.beginPath(); ctx.arc(pq[0],pq[1],3,0,TAU); ctx.fill();
    }
  });
  const L=gproj(A,yaw,g);
  if(L[2]>0&&exA>0){
    const pr=(lt/BEAT)%1;
    ctx.strokeStyle=rgba(C.blue,(1-pr)*exA); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(L[0],L[1],7+26*pr,0,TAU); ctx.stroke();
    ctx.fillStyle=rgba(C.blue,exA); ctx.beginPath(); ctx.arc(L[0],L[1],7,0,TAU); ctx.fill();
    txt(ctx,'LONDON',L[0]-14,L[1]-16,{s:13,ls:2,color:'#fff',w:700,align:'right',alpha:exA*prog(lt,.5,.8)});
  }
  // the message: the count rolls 1 -> 5 as each continent is reached
  const ta=1-E.inCubic(prog(lt,CONV,CONV+.3)), tx=-E.inCubic(prog(lt,CONV,CONV+.3))*140;
  if(ta>0){
    const SZ=520, BASE=640, rise=(1-spring(lt-.45,1.7,.62))*620;
    const t5=ROUTES[3].arr+.12, five=lt>t5?1+.07*Math.exp(-(lt-t5)*6)*Math.cos((lt-t5)*16):1;
    ctx.save(); ctx.globalAlpha=ta; ctx.beginPath(); ctx.rect(0,BASE-SZ*.8,900,SZ*.86); ctx.clip();
    ctx.translate(120+tx,BASE); ctx.scale(five,five);
    setFont(ctx,800,SZ,DISP,true); ctx.fillStyle=C.blue;
    const d=Math.floor(count+1e-6), f=count-d;
    ctx.fillText(String(d),0,rise-f*SZ*.92); if(f>0) ctx.fillText(String(d+1),0,rise+(1-f)*SZ*.92);
    ctx.restore();
    ctx.save(); ctx.globalAlpha=ta; ctx.beginPath(); ctx.rect(0,690,900,140); ctx.clip();
    txt(ctx,'CONTINENTS.',130+tx,800+(1-spring(lt-ROUTES[0].arr+.08,1.8,.62))*140,{fam:DISP,w:800,s:100,color:'#fff',ls:-2});
    ctx.restore();
  }
  // everything collapses into one point, then the page irises open around it
  const md=E.outCubic(prog(lt,CONV+.25,CONV+.5));
  const ir=E.inCubic(prog(lt,CONV+.38,CONV+.9));
  if(ir>0){ctx.fillStyle=C.paper;ctx.beginPath();ctx.arc(CENTER[0],CENTER[1],ir*1160,0,TAU);ctx.fill();}
  if(md>0){ctx.fillStyle=mix(C.blue,C.ink,prog(lt,CONV+.5,CONV+.85));ctx.beginPath();ctx.arc(CENTER[0],CENTER[1],26*md,0,TAU);ctx.fill();}
}

/* =====================================================================
   10.139 — THE HERO CARD   (the site's own line; the ball lands as the full stop)
   ===================================================================== */
const X0=130, FS=118, LH=138, L1=350;
const END_LAND=4*BEAT, END_POP=6*BEAT, END_CLICK=8*BEAT, END_HIT=10*BEAT;
function riseWords(ctx,words,x,base,size,lt,d0,stag){
  ctx.save(); ctx.beginPath(); ctx.rect(0,base-size*1.02,W,size*1.3); ctx.clip();
  let xx=x;
  words.forEach(([s,col,gap],i)=>{
    setFont(ctx,800,size,DISP); ctx.letterSpacing='-2px'; const w=ctx.measureText(s).width;
    ctx.fillStyle=col; ctx.fillText(s,xx,base+(1-spring(lt-d0-i*stag,1.9,.62))*size*1.35);
    xx+=w+(gap??size*.24);
  });
  ctx.restore(); return xx;
}
function cursorShape(ctx,x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.beginPath();
  [[0,0],[0,34],[9,26],[15,40],[21,37],[15,24],[26,24]].forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b)); ctx.closePath();
  ctx.fillStyle=C.ink; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
}
function sEnd(ctx,lt,t){
  bg(ctx,C.paper); ctx.globalAlpha=.6; ctx.drawImage(GRID_L,0,0); ctx.globalAlpha=1;
  const hi=spring(lt-.3,2.2,.45);
  if(hi>0){ctx.save();ctx.translate(X0,L1-150);ctx.scale(hi,hi);txt(ctx,'Hi!',0,0,{fam:SANS,w:500,s:48,color:C.blue});ctx.restore();}
  riseWords(ctx,[['I’m',C.ink],['Thom Bailly',C.blue,0],[',',C.ink]],X0,L1,FS,lt,.4,.07);
  riseWords(ctx,[['and',C.ink],['I',C.ink],['can',C.ink],['transform',C.ink],['your',C.ink]],X0,L1+LH,FS,lt,.55,.05);
  riseWords(ctx,[['growth',C.ink],['strategy',C.ink],['from',C.ink]],X0,L1+2*LH,FS,lt,.7,.05);
  const B4=L1+3*LH;
  let xs=riseWords(ctx,[['good',C.ink],['to',C.ink]],X0,B4,FS,lt,.85,.06);
  // "unparalleled" drops in letter by letter, italic, with a travelling weight wave
  const word='unparalleled', L=[];
  for(let i=0;i<word.length;i++){
    const wv=800-520*bump((lt-1.45-i*.04)/.45);
    setFont(ctx,wv,FS,DISP,true); ctx.letterSpacing='0px'; const cw=ctx.measureText(word[i]).width;
    L.push([word[i],xs,wv]); xs+=cw-3;
  }
  const sheen=prog(lt,END_CLICK+.25,END_CLICK+.85);
  ctx.save(); ctx.beginPath(); ctx.rect(0,B4-FS*1.05,W,FS*1.35); ctx.clip();
  L.forEach(([ch,lx,wv],i)=>{
    const yo=-(1-spring(lt-1.1-i*.03,2.3,.5))*FS*1.3;
    setFont(ctx,wv,FS,DISP,true); ctx.fillStyle=C.blue; ctx.fillText(ch,lx,B4+yo);
    if(sheen>0&&sheen<1){
      const sx=lerp(L[0][1]-200,xs+200,sheen), gr=ctx.createLinearGradient(sx-120,0,sx+120,0);
      gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gr; ctx.fillText(ch,lx,B4+yo);
    }
  });
  ctx.restore();
  // the ball: it sat where the world collapsed, leaps out, and lands as the full stop
  const R=15, dotX=xs+12;
  if(lt<.5){
    const sq=.35*Math.sin(Math.PI*prog(lt,0,.14)), jp=prog(lt,.12,.48), st=1+.6*jp;
    const y=540-jp*jp*820, sy=(1-sq)*st, sx=(1+sq)/st, r=lerp(26,R,prog(lt,.12,.3));
    ctx.save(); ctx.translate(960,y+r*(1-sy)); ctx.scale(sx,sy); ctx.fillStyle=C.ink; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill(); ctx.restore();
    impactRing(ctx,960,540+26,lt,.12,120,C.blue,.5);
  }
  const DOT={ts:1.45,y0:-80,imp:[END_LAND,END_LAND+EIGHTH],hts:[70],floor:B4,R};
  if(lt>=DOT.ts){ballShape(ctx,dotX,ballPath(lt,DOT),R);ctx.fillStyle=C.ink;ctx.fill();}
  DOT.imp.forEach(T=>impactRing(ctx,dotX,B4,lt,T,90,C.blue,.45));
  impactRing(ctx,dotX,B4,lt,END_HIT,160,C.blue,.6);   // the track's last downbeat
  // CTA pill + cursor click
  const bp=spring(lt-END_POP,2.6,.5), press=lt>=END_CLICK?1-.07*Math.exp(-(lt-END_CLICK)*14)*Math.cos((lt-END_CLICK)*30):1;
  setFont(ctx,500,34,SANS); const label='Let’s talk', lw=ctx.measureText(label).width, bw=lw+44*2+46, bh=92, bx=X0, by=B4+72;
  if(bp>0){
    const hov=prog(lt,END_CLICK-.12,END_CLICK-.04);
    ctx.save(); ctx.translate(bx+bw/2,by+bh/2); ctx.scale(bp*press,bp*press); ctx.translate(-bw/2,-bh/2);
    ctx.fillStyle=mix(C.blue,'#005BB0',hov); ctx.beginPath(); ctx.roundRect(0,0,bw,bh,bh/2); ctx.fill();
    if(lt>END_CLICK){const rp=prog(lt,END_CLICK,END_CLICK+.5);ctx.save();ctx.clip();ctx.fillStyle=`rgba(255,255,255,${.35*(1-rp)})`;ctx.beginPath();ctx.arc(bw*.72,bh*.6,20+bw*E.outCubic(rp),0,TAU);ctx.fill();ctx.restore();}
    ctx.fillStyle='#fff'; setFont(ctx,500,34,SANS); ctx.textBaseline='middle'; ctx.fillText(label,44,bh/2+1);
    const ax=44+lw+18, ay=bh/2, nd=Math.max(0,lt-END_POP), nud=4*Math.sin(nd*8)*Math.exp(-nd*2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath();
    ctx.moveTo(ax+nud,ay); ctx.lineTo(ax+28+nud,ay); ctx.moveTo(ax+17+nud,ay-11); ctx.lineTo(ax+28+nud,ay); ctx.lineTo(ax+17+nud,ay+11); ctx.stroke();
    ctx.restore();
    txt(ctx,scramble('CONSULTING.THOMASBAILLY.COM',prog(lt,END_CLICK+.1,END_CLICK+.7),3,Math.floor(t*30)),bx+bw+44,by+bh/2+6,{s:16,ls:4,color:C.gray,w:600});
  }
  const cp=E.inOutCubic(prog(lt,END_POP+.15,END_CLICK-.08));
  if(cp>0){
    const tx=bx+bw*.72, ty=by+bh*.6, cs=lt>END_CLICK-.04&&lt<END_CLICK+.1?.86:1;
    cursorShape(ctx,lerp(1500,tx,cp)+Math.sin(cp*Math.PI)*-40,lerp(1100,ty,cp),cs*1.3);
  }
}

/* =====================================================================
   frame assembly
   ===================================================================== */
const SCN=[[0,sIntro],[T_REV,sRevenue],[T_GLOBE,sGlobe],[T_END,sEnd]];
const sceneAt=tf=>{let i=0;while(i<SCN.length-1&&tf>=SCN[i+1][0]-1e-9)i++;return i;};
function frameMarks(ctx,t){
  const a=E.outCubic(prog(t,.05,.6))*(1-E.inCubic(prog(t,14.4,14.9))); if(a<=0) return;
  ctx.save(); ctx.globalAlpha=a*.9; ctx.globalCompositeOperation='difference'; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  const m=44,L=24; ctx.beginPath();
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.moveTo(x+sx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*L);});
  ctx.stroke(); ctx.restore();
}
function draw(ctx,t,tf=t){
  const i=sceneAt(tf);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.letterSpacing='0px'; ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.setLineDash([]);
  SCN[i][1](ctx,t-SCN[i][0],t);
  ctx.restore();
  frameMarks(ctx,t);
}
// light scenes keep the brand's clean white, dark scenes get the full vignette
function vignette(ctx,tf){ctx.globalAlpha=[1,.3,1,.3][sceneAt(tf)];ctx.drawImage(VIG,0,0);ctx.globalAlpha=1;}

/* ---------------- output ---------------- */
const out=document.getElementById('reel'), octx=out.getContext('2d');
const buf=mkCanvas(), bctx=buf.getContext('2d');
// sub > 1 renders a 180-degree shutter: sub-frames averaged into real motion blur
function renderFrame(f,sub=1){
  const tf=f/FPS, sh=.5/FPS;
  if(sub<=1) draw(octx,tf,tf);
  else{for(let k=0;k<sub;k++){draw(bctx,tf+k/sub*sh,tf);octx.globalAlpha=1/(k+1);octx.drawImage(buf,0,0);}octx.globalAlpha=1;}
  vignette(octx,tf);
}
window.reel={
  ready:(async()=>{
    await Promise.all([document.fonts.load(`800 100px ${DISP}`),document.fonts.load(`italic 800 100px ${DISP}`),document.fonts.load(`500 20px ${SANS}`),document.fonts.load(`500 20px ${MONO}`)]);
    await document.fonts.ready;
    buildCaches(); buildChart(); buildGlobe();
    return true;
  })(),
  renderFrame, snap:()=>out.toDataURL('image/png'), FPS, DUR,
};
if(!RENDER){
  window.reel.ready.then(()=>{
    const music=document.getElementById('music'), hint=document.getElementById('hint');
    let playing=false, base=0, start=0;
    const cur=()=>playing?Math.min(DUR,base+(performance.now()-start)/1000):base;
    function play(){if(base>=DUR-.01)base=0;start=performance.now();playing=true;hint.style.opacity=0;try{music.currentTime=base;music.play().catch(()=>{});}catch(e){}}
    function pause(){base=cur();playing=false;music.pause();hint.style.opacity=1;}
    function frame(){
      let t=cur();
      if(playing&&t>=DUR){playing=false;base=DUR-.001;music.pause();hint.style.opacity=1;t=base;}
      draw(octx,t,t); vignette(octx,t); requestAnimationFrame(frame);
    }
    addEventListener('click',()=>playing?pause():play());
    addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault();playing?pause():play();}
      if(e.code==='ArrowRight'||e.code==='ArrowLeft'){base=clamp(cur()+(e.code==='ArrowRight'?.5:-.5),0,DUR-.001);if(playing){start=performance.now();music.currentTime=base;}}
    });
    requestAnimationFrame(frame);
  });
}
</script>
